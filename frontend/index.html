<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PANA Performance</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>PANA Performance</h1>
        <p>Soccer Intelligence & Performance Analysis</p>
    </header>

    <main>

        <section class="card">

            <h2>Add Player</h2>

            <form id="playerForm">

                <label>First Name</label>
                <input
                    type="text"
                    id="firstName"
                    placeholder="James"
                    required
                >

                <label>Last Name</label>
                <input
                    type="text"
                    id="lastName"
                    placeholder="Maddison"
                    required
                >

                <label>Position</label>

                <select id="position">

                    <option value="GK">Goalkeeper</option>

                    <option value="CB">Center Back</option>
                    <option value="LB">Left Back</option>
                    <option value="RB">Right Back</option>

                    <option value="CDM">Defensive Midfielder</option>
                    <option value="CM">Central Midfielder</option>
                    <option value="CAM">Attacking Midfielder</option>

                    <option value="LW">Left Wing</option>
                    <option value="RW">Right Wing</option>

                    <option value="ST">Striker</option>

                </select>

                <label>Nationality</label>

                <input
                    type="text"
                    id="nationality"
                    placeholder="England"
                    required
                >
                <label>Team</label>
                <select id="team">
                    <option value="">Select Team</option>
                </select>

                <button type="submit">
                    Add Player
                </button>

            </form>

        </section>


        <section class="card">

            <h2>Player Database</h2>

            <div id="playerList">

                <p>
                    Players will appear here.
                </p>

            </div>

        </section>
    <section class="card">
        <h2>Match Analysis</h2>

        <h3>vs UOP</h3>

        <video id="matchVideo" width="100%" controls>
            <source src="/video/vs-uop-autofollow-download.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
       
        <p>
            Current Time:
            <span id="videoTime">00:00</span>
        </p>

        <button id="tagEventButton" type="button">
            Tag Event at Current Time
</button>

<div id="eventTagger">
    <h3>Event Tagger</h3>

    <p>
        Tagged Time:
        <span id="taggedTime">--:--</span>
    </p>

    <label>Player</label>
    <select id="eventPlayer">
        <option value="">Select Player</option>
    </select>

    <label>Event</label>
    <select id="eventType">
        <option value="">Select Event</option>
        <option value="Pass">Pass</option>
        <option value="Carry">Carry</option>
        <option value="Shot">Shot</option>
        <option value="Tackle">Tackle</option>
        <option value="Interception">Interception</option>
        <option value="Aerial Duel">Aerial Duel</option>
        <option value="Recovery">Recovery</option>
    </select>

    <label>Outcome</label>
    <select id="eventOutcome">
        <option value="">Select Outcome</option>
        <option value="Successful">Successful</option>
        <option value="Unsuccessful">Unsuccessful</option>
    </select>

    <label>Foot</label>
    <select id="eventFoot">
        <option value="">Select Foot</option>
        <option value="Right">Right</option>
        <option value="Left">Left</option>
    </select>

    <label>Under Pressure?</label>
    <select id="eventPressure">
        <option value="No">No</option>
        <option value="Yes">Yes</option>
    </select>

    <label>Line Breaking?</label>
    <select id="eventLineBreaking">
        <option value="No">No</option>
        <option value="Yes">Yes</option>
    </select>

    <button id="saveEventButton" type="button">
        Save Event
    </button>
</div>
        
    </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
